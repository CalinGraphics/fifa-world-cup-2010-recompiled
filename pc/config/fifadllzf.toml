# Analysis overrides for fifadllzf.xex (the game module).
# Entries under the "autofix" marker are maintained by tools/autofix_codegen.py:
# function starts the analyser missed because they are only reached by a tail jump.
# The analyser works out the bounds from each seed.

# The CRT's setjmp/longjmp, used by Lua's error handling (luaD_rawrunprotected /
# luaD_throw) and a few other error paths. Without these, a longjmp returns to the
# wrong place and the game carries on down the error path (skipping init steps).
# Found with tools/find_setjmp.py and checked by hand.
setjmp_address = 0x8283C680
longjmp_address = 0x8283C950

